<section class="vc-section" id="conferences">
    <h2>Créer une Conférence</h2>
    <form class="spa-form" id="create-form">
      <input type="text" name="name" placeholder="Nom de la conférence" required />
      <input type="date" name="date" required />
      <input type="text" name="location" placeholder="Lieu" required />
      <button type="submit">Valider</button>
    </form>
  </section>
